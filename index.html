<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>스쿼트 카운터</title>
<style>
  :root{
    --bg:#0b0f1a;
    --card:rgba(255,255,255,0.06);
    --line:rgba(255,255,255,0.12);
    --txt:#eaf0ff;
    --muted:#8a93a8;
    --accent:#37e6a4;
    --accent2:#4d8cff;
    --warn:#ffcf5c;
    --bad:#ff6b6b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(77,140,255,0.18), transparent 60%),
      radial-gradient(800px 500px at -10% 110%, rgba(55,230,164,0.16), transparent 60%),
      var(--bg);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    display:flex;justify-content:center;
  }
  .app{width:100%;max-width:480px;padding:16px 14px 28px;}
  header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  header h1{font-size:21px;margin:0;font-weight:800;letter-spacing:-0.5px;}
  .badge{margin-left:auto;font-size:12px;color:var(--muted);
    border:1px solid var(--line);padding:4px 9px;border-radius:999px;}

  .glass{background:var(--card);border:1px solid var(--line);
    border-radius:18px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}

  /* 설정 */
  .settings{padding:14px;margin-bottom:12px;}
  .settings h2{font-size:13px;color:var(--muted);margin:0 0 12px;font-weight:600;letter-spacing:.4px;}
  .row{display:flex;gap:10px;}
  .field{flex:1;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  .stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .stepper button{width:38px;height:42px;border:0;background:rgba(255,255,255,0.04);
    color:var(--txt);font-size:20px;font-weight:700;}
  .stepper button:active{background:rgba(255,255,255,0.12);}
  .stepper input{flex:1;width:100%;border:0;background:transparent;color:var(--txt);
    text-align:center;font-size:18px;font-weight:700;height:42px;outline:none;}

  /* 카메라 */
  .stage{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:3/4;
    background:#05070d;margin-bottom:12px;}
  .stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .stage video{transform:scaleX(-1);} /* 거울모드 */
  .stage canvas{transform:scaleX(-1);}
  .placeholder{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:8px;color:var(--muted);text-align:center;padding:24px;}
  .placeholder .big{font-size:40px;}

  .overlay-top{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;z-index:3;}
  .pill{background:rgba(0,0,0,0.45);border:1px solid var(--line);border-radius:999px;
    padding:6px 12px;font-size:12px;display:flex;align-items:center;gap:6px;}
  .pill b{color:var(--accent);}
  .restbanner{position:absolute;inset:0;background:rgba(5,7,13,0.78);z-index:4;
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
  .restbanner .num{font-size:64px;font-weight:800;color:var(--warn);}

  /* 카운트 패널 */
  .stats{display:flex;gap:10px;margin-bottom:12px;}
  .stat{flex:1;padding:14px;text-align:center;}
  .stat .k{font-size:12px;color:var(--muted);margin-bottom:4px;}
  .stat .v{font-size:34px;font-weight:800;line-height:1;letter-spacing:-1px;}
  .stat .v small{font-size:16px;color:var(--muted);font-weight:600;}
  #count .v{color:var(--accent);}
  #set .v{color:var(--accent2);}

  .meta{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;margin-bottom:14px;font-size:14px;}
  .meta .t{font-variant-numeric:tabular-nums;font-weight:700;}
  .angle{color:var(--muted);}
  .angle b{color:var(--txt);font-variant-numeric:tabular-nums;}

  /* 버튼 */
  .actions{display:flex;flex-direction:column;gap:10px;}
  .btn{border:0;border-radius:14px;padding:16px;font-size:16px;font-weight:800;color:#04130d;}
  .btn-go{background:linear-gradient(135deg,var(--accent),#21c98a);}
  .btn-go:active{filter:brightness(.92);}
  .btn-stop{background:rgba(255,107,107,0.14);color:var(--bad);border:1px solid rgba(255,107,107,0.4);}
  .btn:disabled{opacity:.45;}

  .hint{font-size:12px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.6;}

  /* 완료 오버레이 */
  #fxLayer{position:fixed;inset:0;pointer-events:none;z-index:50;display:none;}
  #fxCanvas{position:absolute;inset:0;width:100%;height:100%;}
  #doneCard{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.8);
    z-index:51;display:none;text-align:center;padding:26px 30px;border-radius:22px;
    background:rgba(11,15,26,0.9);border:1px solid var(--line);backdrop-filter:blur(10px);
    box-shadow:0 20px 60px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.2,1.4,.4,1);}
  #doneCard.show{display:block;transform:translate(-50%,-50%) scale(1);}
  #doneCard .emo{font-size:54px;}
  #doneCard h3{margin:8px 0 4px;font-size:24px;}
  #doneCard p{margin:0;color:var(--muted);font-size:14px;}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🏋️ 스쿼트 카운터</h1>
    <span class="badge">창원예술학교</span>
  </header>

  <!-- 설정 -->
  <section class="glass settings" id="settingsBox">
    <h2>운동 설정</h2>
    <div class="row" style="margin-bottom:10px;">
      <div class="field">
        <label>세트당 횟수</label>
        <div class="stepper">
          <button data-step="reps" data-d="-1">−</button>
          <input id="reps" type="number" value="15" min="1" inputmode="numeric">
          <button data-step="reps" data-d="1">+</button>
        </div>
      </div>
      <div class="field">
        <label>세트 수</label>
        <div class="stepper">
          <button data-step="sets" data-d="-1">−</button>
          <input id="sets" type="number" value="3" min="1" inputmode="numeric">
          <button data-step="sets" data-d="1">+</button>
        </div>
      </div>
    </div>
    <div class="field">
      <label>세트 사이 휴식 (초)</label>
      <div class="stepper">
        <button data-step="rest" data-d="-5">−</button>
        <input id="rest" type="number" value="30" min="0" inputmode="numeric">
        <button data-step="rest" data-d="5">+</button>
      </div>
    </div>
  </section>

  <!-- 카메라 무대 -->
  <div class="stage glass">
    <video id="video" playsinline muted></video>
    <canvas id="poseCanvas"></canvas>
    <div class="overlay-top">
      <span class="pill" id="statusPill">⚪ 대기 중</span>
      <span class="pill" id="phasePill" style="margin-left:auto;display:none;">자세: <b id="phaseTxt">서기</b></span>
    </div>
    <div class="placeholder" id="placeholder">
      <span class="big">📷</span>
      <div>운동 시작을 누르면<br>카메라가 켜집니다</div>
    </div>
    <div class="restbanner" id="restBanner">
      <div style="color:var(--muted);font-size:14px;">휴식</div>
      <div class="num" id="restNum">30</div>
      <div style="color:var(--muted);font-size:13px;">다음 세트를 준비하세요</div>
    </div>
  </div>

  <!-- 카운트 -->
  <div class="stats">
    <div class="stat glass" id="count">
      <div class="k">COUNT</div>
      <div class="v"><span id="countV">0</span> <small>/ <span id="targetV">15</span></small></div>
    </div>
    <div class="stat glass" id="set">
      <div class="k">SET</div>
      <div class="v"><span id="setV">1</span> <small>/ <span id="setsV">3</span></small></div>
    </div>
  </div>

  <div class="glass meta">
    <span class="t">⏱ <span id="timer">00:00</span></span>
    <span class="angle">무릎각도 <b id="angleV">--</b>°</span>
  </div>

  <!-- 버튼 -->
  <div class="actions">
    <button class="btn btn-go" id="startBtn">운동 시작</button>
    <button class="btn btn-stop" id="stopBtn" disabled>정지 / 리셋</button>
  </div>

  <p class="hint">
    전신(머리~발)이 화면에 들어오게 1.5~2m 떨어져 서주세요.<br>
    밝은 곳에서 옆모습이 가장 잘 인식됩니다.
  </p>
</div>

<!-- 완료 연출 -->
<div id="fxLayer"><canvas id="fxCanvas"></canvas></div>
<div id="doneCard">
  <div class="emo">🎉👏</div>
  <h3>운동 완료!</h3>
  <p id="doneMsg"></p>
</div>

<script type="module">
import {
  PoseLandmarker,
  FilesetResolver,
  DrawingUtils
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

/* ---------- 요소 ---------- */
const video = document.getElementById("video");
const canvas = document.getElementById("poseCanvas");
const ctx = canvas.getContext("2d");
const placeholder = document.getElementById("placeholder");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const statusPill = document.getElementById("statusPill");
const phasePill = document.getElementById("phasePill");
const phaseTxt = document.getElementById("phaseTxt");

const repsInput = document.getElementById("reps");
const setsInput = document.getElementById("sets");
const restInput = document.getElementById("rest");

const countV = document.getElementById("countV");
const targetV = document.getElementById("targetV");
const setV = document.getElementById("setV");
const setsV = document.getElementById("setsV");
const angleV = document.getElementById("angleV");
const timerEl = document.getElementById("timer");

const restBanner = document.getElementById("restBanner");
const restNum = document.getElementById("restNum");

/* ---------- 상태 ---------- */
let landmarker = null;
let stream = null;
let running = false;
let rafId = null;

let count = 0;
let curSet = 1;
let targetReps = 15;
let totalSets = 3;
let restSec = 30;

let phase = "up";              // up(서기) / down(앉기)
const DOWN_ANGLE = 100;        // 이 각도보다 작으면 앉은 것
const UP_ANGLE = 160;          // 이 각도보다 크면 선 것
let smoothAngle = null;

let startTime = 0;
let timerInt = null;
let resting = false;

const drawUtils = new DrawingUtils(ctx);

/* ---------- 설정 스텝퍼 ---------- */
document.querySelectorAll("[data-step]").forEach(b=>{
  b.addEventListener("click",()=>{
    const map={reps:repsInput,sets:setsInput,rest:restInput};
    const el=map[b.dataset.step];
    let v=parseInt(el.value||"0")+parseInt(b.dataset.d);
    const min=parseInt(el.min||"0");
    if(v<min)v=min;
    el.value=v;
    syncTargets();
  });
});
function syncTargets(){
  targetV.textContent=repsInput.value;
  setsV.textContent=setsInput.value;
}
syncTargets();

/* ---------- 각도 계산 ---------- */
function angle(a,b,c){
  const ab={x:a.x-b.x,y:a.y-b.y};
  const cb={x:c.x-b.x,y:c.y-b.y};
  const dot=ab.x*cb.x+ab.y*cb.y;
  const m1=Math.hypot(ab.x,ab.y), m2=Math.hypot(cb.x,cb.y);
  if(m1===0||m2===0)return 180;
  let cos=dot/(m1*m2);
  cos=Math.max(-1,Math.min(1,cos));
  return Math.acos(cos)*180/Math.PI;
}

/* ---------- 모델 로드 ---------- */
async function loadModel(){
  statusPill.textContent="⏳ 모델 불러오는 중";
  const fileset=await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  landmarker=await PoseLandmarker.createFromOptions(fileset,{
    baseOptions:{
      modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate:"GPU"
    },
    runningMode:"VIDEO",
    numPoses:1
  });
}

/* ---------- 시작 ---------- */
async function start(){
  targetReps=Math.max(1,parseInt(repsInput.value)||15);
  totalSets=Math.max(1,parseInt(setsInput.value)||3);
  restSec=Math.max(0,parseInt(restInput.value)||0);

  count=0; curSet=1; phase="up"; smoothAngle=null;
  countV.textContent="0"; setV.textContent="1";
  syncTargets();

  startBtn.disabled=true;
  statusPill.textContent="⏳ 준비 중";

  try{
    if(!landmarker) await loadModel();
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:"environment",width:{ideal:720},height:{ideal:960}},
      audio:false
    });
    video.srcObject=stream;
    await video.play();
  }catch(e){
    statusPill.textContent="⚠ 카메라 권한 필요";
    alert("카메라를 사용할 수 없습니다.\n브라우저에서 카메라 권한을 허용했는지, https 주소인지 확인해주세요.\n\n"+e.message);
    startBtn.disabled=false;
    return;
  }

  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  placeholder.style.display="none";
  phasePill.style.display="flex";
  statusPill.textContent="🟢 분석 중";
  stopBtn.disabled=false;
  running=true;

  startTime=Date.now();
  timerInt=setInterval(updateTimer,1000);

  loop();
}

function updateTimer(){
  const s=Math.floor((Date.now()-startTime)/1000);
  const m=String(Math.floor(s/60)).padStart(2,"0");
  const ss=String(s%60).padStart(2,"0");
  timerEl.textContent=`${m}:${ss}`;
}

/* ---------- 메인 루프 ---------- */
let lastTs=-1;
function loop(){
  if(!running)return;
  if(video.currentTime!==lastTs){
    lastTs=video.currentTime;
    const res=landmarker.detectForVideo(video,performance.now());
    draw(res);
    if(!resting) analyze(res);
  }
  rafId=requestAnimationFrame(loop);
}

function draw(res){
  ctx.save();
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(res.landmarks&&res.landmarks.length){
    for(const lm of res.landmarks){
      drawUtils.drawConnectors(lm,PoseLandmarker.POSE_CONNECTIONS,{color:"#4d8cff",lineWidth:3});
      drawUtils.drawLandmarks(lm,{color:"#37e6a4",radius:4});
    }
  }
  ctx.restore();
}

/* ---------- 동작 분석 ---------- */
function analyze(res){
  if(!res.landmarks||!res.landmarks.length){
    angleV.textContent="--";
    return;
  }
  const lm=res.landmarks[0];
  // 양쪽 무릎각: 23/24 hip, 25/26 knee, 27/28 ankle
  const left=angle(lm[23],lm[25],lm[27]);
  const right=angle(lm[24],lm[26],lm[28]);
  // 더 잘 보이는(visibility 높은) 쪽 사용, 없으면 평균
  let a=(left+right)/2;
  smoothAngle = smoothAngle===null ? a : smoothAngle*0.6 + a*0.4;
  const shown=Math.round(smoothAngle);
  angleV.textContent=shown;

  // 상태 머신
  if(phase==="up" && smoothAngle<DOWN_ANGLE){
    phase="down";
    phaseTxt.textContent="앉기";
  } else if(phase==="down" && smoothAngle>UP_ANGLE){
    phase="up";
    phaseTxt.textContent="서기";
    addCount();
  }
}

function addCount(){
  count++;
  countV.textContent=count;
  beep(660,0.08);          // 카운트 효과음
  bump(countV);
  if(count>=targetReps){
    setComplete();
  }
}

function setComplete(){
  if(curSet>=totalSets){
    finishAll();
  }else{
    // 휴식
    if(restSec>0){
      startRest();
    }else{
      nextSet();
    }
  }
}

function startRest(){
  resting=true;
  let left=restSec;
  restNum.textContent=left;
  restBanner.style.display="flex";
  beep(440,0.15);
  const ri=setInterval(()=>{
    left--;
    restNum.textContent=left;
    if(left<=0){
      clearInterval(ri);
      restBanner.style.display="none";
      resting=false;
      nextSet();
    }
  },1000);
}

function nextSet(){
  curSet++;
  count=0; phase="up";
  countV.textContent="0";
  setV.textContent=curSet;
  beep(880,0.12);
}

/* ---------- 완료 ---------- */
function finishAll(){
  running=false;
  if(rafId)cancelAnimationFrame(rafId);
  clearInterval(timerInt);

  const totalReps=targetReps*totalSets;
  const t=timerEl.textContent;
  document.getElementById("doneMsg").textContent=
    `총 ${totalSets}세트 · ${totalReps}회 · ${t} 완료`;

  celebrate();        // 폭죽 + 박수 + 알림 (5초)
  setTimeout(stopAll,300); // 카메라는 살짝 뒤 정리
}

function stopAll(){
  running=false;
  if(rafId)cancelAnimationFrame(rafId);
  clearInterval(timerInt);
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  video.srcObject=null;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  placeholder.style.display="flex";
  phasePill.style.display="none";
  statusPill.textContent="⚪ 대기 중";
  startBtn.disabled=false;
  stopBtn.disabled=true;
  resting=false;
  restBanner.style.display="none";
}

/* 정지/리셋 버튼 */
function reset(){
  stopAll();
  count=0;curSet=1;phase="up";smoothAngle=null;
  countV.textContent="0";setV.textContent="1";
  angleV.textContent="--";timerEl.textContent="00:00";
}

/* ---------- 효과음 (Web Audio로 합성) ---------- */
let actx=null;
function audio(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function beep(freq,dur){
  try{
    const a=audio();const o=a.createOscillator();const g=a.createGain();
    o.frequency.value=freq;o.type="sine";
    o.connect(g);g.connect(a.destination);
    g.gain.setValueAtTime(0.001,a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.3,a.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur);
    o.start();o.stop(a.currentTime+dur);
  }catch(e){}
}
// 박수: 짧은 노이즈 버스트 여러 번
function clap(times=8){
  try{
    const a=audio();
    for(let i=0;i<times;i++){
      const t=a.currentTime+i*0.13+Math.random()*0.03;
      const buf=a.createBuffer(1,a.sampleRate*0.05,a.sampleRate);
      const d=buf.getChannelData(0);
      for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*Math.pow(1-j/d.length,2);
      const src=a.createBufferSource();src.buffer=buf;
      const g=a.createGain();g.gain.value=0.5;
      const f=a.createBiquadFilter();f.type="bandpass";f.frequency.value=1500;
      src.connect(f);f.connect(g);g.connect(a.destination);
      src.start(t);
    }
  }catch(e){}
}

/* ---------- 폭죽 + 알림 5초 ---------- */
const fxLayer=document.getElementById("fxLayer");
const fxCanvas=document.getElementById("fxCanvas");
const fxCtx=fxCanvas.getContext("2d");
const doneCard=document.getElementById("doneCard");
let particles=[];let fxRaf=null;

function celebrate(){
  clap(10);
  beep(523,0.2);setTimeout(()=>beep(659,0.2),150);setTimeout(()=>beep(784,0.3),300);

  fxLayer.style.display="block";
  fxCanvas.width=innerWidth;fxCanvas.height=innerHeight;
  doneCard.classList.add("show");

  // 폭죽 여러 발
  spawnFirework();
  const burst=setInterval(spawnFirework,500);
  fxAnim();

  setTimeout(()=>{
    clearInterval(burst);
  },4000);

  // 5초 후 정리
  setTimeout(()=>{
    doneCard.classList.remove("show");
    fxLayer.style.display="none";
    particles=[];
    if(fxRaf)cancelAnimationFrame(fxRaf);
  },5000);
}

function spawnFirework(){
  const cx=Math.random()*fxCanvas.width;
  const cy=Math.random()*fxCanvas.height*0.5+fxCanvas.height*0.1;
  const hue=Math.floor(Math.random()*360);
  const n=40;
  for(let i=0;i<n;i++){
    const ang=(Math.PI*2*i)/n;
    const sp=Math.random()*4+2;
    particles.push({
      x:cx,y:cy,
      vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,
      life:1,hue
    });
  }
}
function fxAnim(){
  fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height);
  for(const p of particles){
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.06;p.vx*=0.99;p.life-=0.012;
    fxCtx.globalAlpha=Math.max(p.life,0);
    fxCtx.fillStyle=`hsl(${p.hue},90%,60%)`;
    fxCtx.beginPath();fxCtx.arc(p.x,p.y,3,0,Math.PI*2);fxCtx.fill();
  }
  fxCtx.globalAlpha=1;
  particles=particles.filter(p=>p.life>0);
  fxRaf=requestAnimationFrame(fxAnim);
}

/* ---------- 작은 애니메이션 ---------- */
function bump(el){
  el.style.transition="transform .12s";
  el.style.transform="scale(1.35)";
  setTimeout(()=>el.style.transform="scale(1)",120);
}

/* ---------- 이벤트 ---------- */
startBtn.addEventListener("click",()=>{ audio().resume&&audio().resume(); start(); });
stopBtn.addEventListener("click",reset);
window.addEventListener("resize",()=>{
  if(fxLayer.style.display==="block"){fxCanvas.width=innerWidth;fxCanvas.height=innerHeight;}
});
</script>
