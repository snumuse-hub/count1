<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>운동 카운터</title>
<style>
:root{--bg:#0b0f1a;--card:rgba(255,255,255,0.06);--line:rgba(255,255,255,0.12);--txt:#eaf0ff;--muted:#8a93a8;--accent:#37e6a4;--accent2:#4d8cff;--warn:#ffcf5c;--bad:#ff6b6b;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{min-height:100%;background:radial-gradient(900px 500px at 80% -10%,rgba(77,140,255,0.18),transparent 60%),radial-gradient(800px 500px at -10% 110%,rgba(55,230,164,0.16),transparent 60%),var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;}
.page{display:none;flex-direction:column;min-height:100vh;padding:16px 14px 32px;max-width:480px;margin:0 auto;}
.page.active{display:flex;}
.glass{background:var(--card);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
.btn{border:0;border-radius:14px;padding:16px;font-size:16px;font-weight:800;cursor:pointer;width:100%;}
.btn-go{background:linear-gradient(135deg,var(--accent),#21c98a);color:#04130d;}
.btn-go:active{filter:brightness(.9);}
.btn-stop{background:rgba(255,107,107,0.14);color:var(--bad);border:1px solid rgba(255,107,107,0.4);}
.btn:disabled{opacity:.4;}
header{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
header h1{font-size:20px;font-weight:800;letter-spacing:-.5px;}
.badge{margin-left:auto;font-size:12px;color:var(--muted);border:1px solid var(--line);padding:4px 9px;border-radius:999px;}
/* 종목 선택 */
.ex-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.ex-card{padding:16px 12px;border-radius:16px;border:2px solid var(--line);background:var(--card);text-align:center;cursor:pointer;transition:border-color .2s,background .2s;}
.ex-card.sel{border-color:var(--accent);background:rgba(55,230,164,0.1);}
.ex-card .ico{font-size:30px;margin-bottom:6px;}
.ex-card .nm{font-size:14px;font-weight:700;}
.ex-card .tip{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4;}
/* 설정 */
.settings{padding:16px;margin-bottom:12px;}
.settings h2{font-size:13px;color:var(--muted);margin-bottom:12px;font-weight:600;}
.row{display:flex;gap:10px;margin-bottom:10px;}
.field{flex:1;}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.stepper button{width:40px;height:44px;border:0;background:rgba(255,255,255,0.04);color:var(--txt);font-size:22px;font-weight:700;cursor:pointer;}
.stepper button:active{background:rgba(255,255,255,0.12);}
.stepper input{flex:1;border:0;background:transparent;color:var(--txt);text-align:center;font-size:18px;font-weight:700;height:44px;outline:none;}
/* 자세 안내 */
.guide{padding:14px;margin-bottom:14px;}
.guide h3{font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:600;}
.guide p{font-size:13px;line-height:1.8;color:var(--txt);}
.key{color:var(--accent);font-weight:700;}
/* 운동 화면 */
.stage{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:3/4;background:#05070d;margin-bottom:12px;flex-shrink:0;}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.stage.mirror video,.stage.mirror canvas{transform:scaleX(-1);}
.placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);text-align:center;padding:24px;}
.overlay-top{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;z-index:3;}
.overlay-bot{position:absolute;bottom:10px;left:10px;right:10px;display:flex;gap:8px;z-index:3;}
.pill{background:rgba(0,0,0,0.5);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;display:flex;align-items:center;gap:5px;}
.pill b{color:var(--accent);}
.cambtn{background:rgba(0,0,0,0.5);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--txt);margin-left:auto;cursor:pointer;}
.restbanner{position:absolute;inset:0;background:rgba(5,7,13,0.82);z-index:4;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
.rnum{font-size:72px;font-weight:800;color:var(--warn);}
.stats{display:flex;gap:10px;margin-bottom:10px;}
.stat{flex:1;padding:14px;text-align:center;}
.stat .k{font-size:12px;color:var(--muted);margin-bottom:4px;}
.stat .v{font-size:36px;font-weight:800;line-height:1;letter-spacing:-1px;}
.stat .v small{font-size:16px;color:var(--muted);font-weight:600;}
#cntBox .v{color:var(--accent);}
#setBox .v{color:var(--accent2);}
.meta{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;margin-bottom:12px;font-size:13px;}
.angle-lbl{color:var(--muted);}
.angle-lbl b{color:var(--txt);font-variant-numeric:tabular-nums;}
.actions{display:flex;flex-direction:column;gap:10px;}
.hint-s{font-size:11px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.6;}
/* 완료 */
#fxLayer{position:fixed;inset:0;pointer-events:none;z-index:50;display:none;}
#fxCanvas{position:absolute;inset:0;width:100%;height:100%;}
#doneCard{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.8);z-index:51;display:none;text-align:center;padding:28px 32px;border-radius:24px;background:rgba(11,15,26,0.93);border:1px solid var(--line);backdrop-filter:blur(12px);box-shadow:0 20px 60px rgba(0,0,0,.6);transition:transform .35s cubic-bezier(.2,1.4,.4,1);cursor:pointer;min-width:260px;}
#doneCard.show{display:block;transform:translate(-50%,-50%) scale(1);}
#doneCard .emo{font-size:56px;}
#doneCard h3{margin:10px 0 4px;font-size:22px;}
#doneCard p{color:var(--muted);font-size:13px;margin-bottom:14px;}
#doneCard .tap{font-size:13px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:8px 20px;display:inline-block;}
</style>
</head>
<body>

<!-- 페이지1: 종목 선택 -->
<div class="page active" id="p1">
  <header><h1>🏋️ 운동 카운터</h1><span class="badge">창원예술학교</span></header>
  <p style="font-size:13px;color:var(--muted);margin-bottom:14px;">종목을 선택하세요</p>
  <div class="ex-grid" id="exGrid">
    <div class="ex-card sel" data-ex="squat"><div class="ico">🦵</div><div class="nm">스쿼트</div><div class="tip">무릎을 굽혔다 펴기</div></div>
    <div class="ex-card" data-ex="pushup"><div class="ico">💪</div><div class="nm">푸시업</div><div class="tip">팔굽혀펴기</div></div>
    <div class="ex-card" data-ex="situp"><div class="ico">🧘</div><div class="nm">싯업</div><div class="tip">윗몸 일으키기</div></div>
    <div class="ex-card" data-ex="legraise"><div class="ico">🦶</div><div class="nm">레그레이즈</div><div class="tip">누워서 다리 올리기</div></div>
    <div class="ex-card" data-ex="curl"><div class="ico">🤜</div><div class="nm">암컬</div><div class="tip">팔꿈치 굽혔다 펴기</div></div>
  </div>
  <button class="btn btn-go" id="p1next">다음 →</button>
</div>

<!-- 페이지2: 설정 + 자세 안내 -->
<div class="page" id="p2">
  <header>
    <button id="p2back" style="background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer;">←</button>
    <h1 id="p2title">설정</h1><span class="badge">창원예술학교</span>
  </header>
  <section class="glass settings">
    <h2>운동 설정</h2>
    <div class="row">
      <div class="field"><label>세트당 횟수</label>
        <div class="stepper"><button data-step="reps" data-d="-1">−</button><input id="reps" type="number" value="15" min="1" inputmode="numeric"><button data-step="reps" data-d="1">+</button></div>
      </div>
      <div class="field"><label>세트 수</label>
        <div class="stepper"><button data-step="sets" data-d="-1">−</button><input id="sets" type="number" value="3" min="1" inputmode="numeric"><button data-step="sets" data-d="1">+</button></div>
      </div>
    </div>
    <div class="field"><label>세트 사이 휴식 (초)</label>
      <div class="stepper"><button data-step="rest" data-d="-5">−</button><input id="rest" type="number" value="30" min="0" inputmode="numeric"><button data-step="rest" data-d="5">+</button></div>
    </div>
  </section>
  <div class="glass guide" id="guideBox"><h3>📋 자세 안내 &amp; 인식 조건</h3><p id="guideText"></p></div>
  <button class="btn btn-go" id="p2next">운동 시작 →</button>
</div>

<!-- 페이지3: 운동 -->
<div class="page" id="p3">
  <header>
    <button id="p3back" style="background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer;">←</button>
    <h1 id="p3title">운동</h1><span class="badge">창원예술학교</span>
  </header>
  <div class="stage glass" id="stageEl">
    <video id="video" playsinline muted></video>
    <canvas id="poseCanvas"></canvas>
    <div class="overlay-top">
      <span class="pill" id="statusPill">⚪ 준비 중</span>
      <button class="cambtn" id="camBtn">🔄 <span id="camLabel">셀카</span></button>
    </div>
    <div class="overlay-bot">
      <span class="pill" id="phasePill" style="display:none;">자세: <b id="phaseTxt">-</b></span>
    </div>
    <div class="placeholder" id="placeholder"><div style="font-size:40px;">📷</div><div style="font-size:13px;">카메라 연결 중...</div></div>
    <div class="restbanner" id="restBanner">
      <div style="color:var(--muted);font-size:14px;">휴식</div>
      <div class="rnum" id="restNum">30</div>
      <div style="color:var(--muted);font-size:13px;">다음 세트를 준비하세요</div>
    </div>
  </div>
  <div class="stats">
    <div class="stat glass" id="cntBox"><div class="k">COUNT</div><div class="v"><span id="countV">0</span><small> / <span id="targetV">15</span></small></div></div>
    <div class="stat glass" id="setBox"><div class="k">SET</div><div class="v"><span id="setV">1</span><small> / <span id="setsV">3</span></small></div></div>
  </div>
  <div class="glass meta">
    <span>⏱ <span id="timer" style="font-weight:700;font-variant-numeric:tabular-nums;">00:00</span></span>
    <span class="angle-lbl">각도 <b id="angleV">--</b>°</span>
  </div>
  <div class="actions"><button class="btn btn-stop" id="stopBtn">정지 / 리셋</button></div>
  <p class="hint-s" id="hintS"></p>
</div>

<!-- 완료 -->
<div id="fxLayer"><canvas id="fxCanvas"></canvas></div>
<div id="doneCard">
  <div class="emo">🎉👏</div>
  <h3>운동 완료!</h3>
  <p id="doneMsg"></p>
  <div class="tap">화면을 터치하면 닫힙니다</div>
</div>

<script type="module">
import{PoseLandmarker,FilesetResolver,DrawingUtils}from"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const KO_NUM=["","하나","둘","셋","넷","다섯","여섯","일곱","여덟","아홉","열","열하나","열둘","열셋","열넷","열다섯","열여섯","열일곱","열여덟","열아홉","스물","스물하나","스물둘","스물셋","스물넷","스물다섯","스물여섯","스물일곱","스물여덟","스물아홉","서른"];

const EXERCISES={
  squat:{
    name:"스쿼트",
    guide:`<span class="key">📌 인식 조건</span><br>무릎 각도가 <span class="key">100° 이하</span>로 굽혀지면 '앉음' 인식, 다시 <span class="key">160° 이상</span>으로 펴지면 1회 카운트.<br><br><span class="key">✅ 잘 되는 자세</span><br>• 전신이 화면에 들어오게 1.5~2m 거리<br>• 옆모습 또는 약간 비스듬히 서면 더 잘 인식<br>• 허리를 곧게 펴고 무릎이 발끝을 넘지 않게`,
    hint:"전신이 보이게 1.5m 이상 거리. 옆모습이 가장 잘 인식됩니다.",
    initPhase:"up",
    analyze(lm,s){
      const a=avg(ang(lm[23],lm[25],lm[27]),ang(lm[24],lm[26],lm[28]));
      s.smooth=s.smooth==null?a:s.smooth*.6+a*.4;
      let counted=false;
      if(s.phase==="up"&&s.smooth<100){s.phase="down";s.label="앉기";}
      else if(s.phase==="down"&&s.smooth>160){s.phase="up";s.label="서기";counted=true;}
      return{val:Math.round(s.smooth),counted};
    }
  },
  pushup:{
    name:"푸시업",
    guide:`<span class="key">📌 인식 조건</span><br>팔꿈치 각도가 <span class="key">100° 이하</span>로 굽혀지면 '내려가기', 다시 <span class="key">155° 이상</span>이면 1회 카운트.<br><br><span class="key">✅ 잘 되는 자세</span><br>• 폰을 <span class="key">옆 바닥에 눕혀</span> 전신 옆모습 촬영<br>• 머리~발끝이 화면에 들어와야 함<br>• 팔을 완전히 굽혔다 완전히 펴기`,
    hint:"폰을 옆 바닥에 눕혀서 전신 옆모습이 보이게 하세요.",
    initPhase:"up",
    analyze(lm,s){
      const a=avg(ang(lm[11],lm[13],lm[15]),ang(lm[12],lm[14],lm[16]));
      s.smooth=s.smooth==null?a:s.smooth*.6+a*.4;
      let counted=false;
      if(s.phase==="up"&&s.smooth<100){s.phase="down";s.label="내려가기";}
      else if(s.phase==="down"&&s.smooth>155){s.phase="up";s.label="올라오기";counted=true;}
      return{val:Math.round(s.smooth),counted};
    }
  },
  situp:{
    name:"싯업",
    guide:`<span class="key">📌 인식 조건</span><br>어깨-엉덩이-무릎 각도가 <span class="key">60° 이상</span>이면 '일어남', 다시 <span class="key">30° 이하</span>로 누우면 1회 카운트.<br><br><span class="key">✅ 잘 되는 자세</span><br>• 폰을 <span class="key">옆 바닥이나 낮은 곳</span>에 세워서 옆모습 촬영<br>• 무릎을 세우고 눕는 자세에서 상체를 완전히 일으키기<br>• 상체~무릎이 화면에 들어오면 OK`,
    hint:"폰을 옆에 세우고 옆모습 촬영. 상체~무릎이 화면에 들어와야 해요.",
    initPhase:"down",
    analyze(lm,s){
      const a=avg(ang(lm[11],lm[23],lm[25]),ang(lm[12],lm[24],lm[26]));
      s.smooth=s.smooth==null?a:s.smooth*.6+a*.4;
      let counted=false;
      if(s.phase==="down"&&s.smooth>60){s.phase="up";s.label="일어남";}
      else if(s.phase==="up"&&s.smooth<30){s.phase="down";s.label="누움";counted=true;}
      return{val:Math.round(s.smooth),counted};
    }
  },
  legraise:{
    name:"레그레이즈",
    guide:`<span class="key">📌 인식 조건</span><br>엉덩이-무릎-발목 각도가 <span class="key">130° 이상</span>이면 '다리 올림', 다시 <span class="key">175° 이하</span>로 내리면 1회 카운트.<br><br><span class="key">✅ 잘 되는 자세</span><br>• 폰을 <span class="key">옆 바닥</span>에 눕혀서 옆모습 촬영<br>• 허리를 바닥에 붙이고 다리를 곧게 펴서 올리기<br>• 하체 전체(엉덩이~발끝)가 화면에 들어오도록`,
    hint:"폰을 옆 바닥에 눕혀서 옆모습 촬영. 다리 전체가 보여야 해요.",
    initPhase:"down",
    analyze(lm,s){
      const a=avg(ang(lm[23],lm[25],lm[27]),ang(lm[24],lm[26],lm[28]));
      s.smooth=s.smooth==null?a:s.smooth*.6+a*.4;
      let counted=false;
      if(s.phase==="down"&&s.smooth>130){s.phase="up";s.label="다리 올림";}
      else if(s.phase==="up"&&s.smooth<170){s.phase="down";s.label="다리 내림";counted=true;}
      return{val:Math.round(s.smooth),counted};
    }
  },
  curl:{
    name:"암컬",
    guide:`<span class="key">📌 인식 조건</span><br>팔꿈치 각도가 <span class="key">60° 이하</span>로 굽혀지면 '팔 올림', 다시 <span class="key">155° 이상</span>으로 펴지면 1회 카운트.<br><br><span class="key">✅ 잘 되는 자세</span><br>• 폰을 <span class="key">정면 또는 약간 옆</span>에 세워두기<br>• 팔꿈치를 몸에 붙이고 완전히 굽혔다 완전히 펴기<br>• 어깨~손목이 화면에 모두 들어와야 함`,
    hint:"정면 또는 약간 옆으로. 어깨~손목이 화면에 다 들어오게 하세요.",
    initPhase:"down",
    analyze(lm,s){
      const a=avg(ang(lm[11],lm[13],lm[15]),ang(lm[12],lm[14],lm[16]));
      s.smooth=s.smooth==null?a:s.smooth*.6+a*.4;
      let counted=false;
      if(s.phase==="down"&&s.smooth<60){s.phase="up";s.label="팔 올림";}
      else if(s.phase==="up"&&s.smooth>155){s.phase="down";s.label="팔 내림";counted=true;}
      return{val:Math.round(s.smooth),counted};
    }
  }
};

let selEx="squat",landmarker=null,stream=null,rafId=null,running=false,facingMode="user";
let count=0,curSet=1,targetReps=15,totalSets=3,restSec=30;
let exState={phase:"up",label:"서기",smooth:null};
let timerInt=null,startTime=0,resting=false;

const $=id=>document.getElementById(id);
const video=$("video"),canvas=$("poseCanvas"),ctx=canvas.getContext("2d");
const placeholder=$("placeholder"),statusPill=$("statusPill"),phasePill=$("phasePill"),phaseTxt=$("phaseTxt");
const camBtn=$("camBtn"),camLabel=$("camLabel"),restBanner=$("restBanner"),restNumEl=$("restNum");
const countV=$("countV"),targetV=$("targetV"),setV=$("setV"),setsV=$("setsV"),angleV=$("angleV"),timerEl=$("timer");
const fxLayer=$("fxLayer"),fxCanvas=$("fxCanvas"),fxCtx=fxCanvas.getContext("2d"),doneCard=$("doneCard");
const stageEl=$("stageEl");
let drawUtils=null;

/* 페이지 */
function showPage(id){document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));$(id).classList.add("active");scrollTo(0,0);}

/* 종목 선택 */
document.querySelectorAll(".ex-card").forEach(c=>{
  c.addEventListener("click",()=>{
    document.querySelectorAll(".ex-card").forEach(x=>x.classList.remove("sel"));
    c.classList.add("sel");selEx=c.dataset.ex;
  });
});
$("p1next").addEventListener("click",()=>{
  const ex=EXERCISES[selEx];
  $("p2title").textContent=ex.name+" 설정";
  $("guideText").innerHTML=ex.guide;
  syncT();showPage("p2");
});
$("p2back").addEventListener("click",()=>showPage("p1"));
document.querySelectorAll("[data-step]").forEach(b=>{
  b.addEventListener("click",()=>{
    const m={reps:$("reps"),sets:$("sets"),rest:$("rest")};
    const el=m[b.dataset.step];
    let v=parseInt(el.value||0)+parseInt(b.dataset.d);
    if(v<parseInt(el.min||0))v=parseInt(el.min||0);
    el.value=v;syncT();
  });
});
function syncT(){targetV.textContent=$("reps").value;setsV.textContent=$("sets").value;}

$("p2next").addEventListener("click",async()=>{
  targetReps=Math.max(1,parseInt($("reps").value)||15);
  totalSets=Math.max(1,parseInt($("sets").value)||3);
  restSec=Math.max(0,parseInt($("rest").value)||0);
  const ex=EXERCISES[selEx];
  $("p3title").textContent=ex.name;
  $("hintS").textContent=ex.hint;
  syncT();setsV.textContent=totalSets;
  count=0;curSet=1;exState={phase:ex.initPhase,label:"-",smooth:null};
  countV.textContent="0";setV.textContent="1";timerEl.textContent="00:00";angleV.textContent="--";
  showPage("p3");
  await startCamera();
});
$("p3back").addEventListener("click",()=>{stopAll();showPage("p2");});
$("stopBtn").addEventListener("click",()=>{
  stopAll();
  count=0;curSet=1;countV.textContent="0";setV.textContent="1";timerEl.textContent="00:00";angleV.textContent="--";
  showPage("p2");
});

/* 카메라 */
applyMirror();
async function startCamera(){
  statusPill.textContent="⏳ 모델 불러오는 중";
  try{
    if(!landmarker){
      const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
      landmarker=await PoseLandmarker.createFromOptions(fs,{
        baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",delegate:"GPU"},
        runningMode:"VIDEO",numPoses:1
      });
      drawUtils=new DrawingUtils(ctx);
    }
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode,width:{ideal:720},height:{ideal:960}},audio:false});
    video.srcObject=stream;await video.play();
    canvas.width=video.videoWidth;canvas.height=video.videoHeight;
    placeholder.style.display="none";phasePill.style.display="flex";
    statusPill.textContent="🟢 분석 중";running=true;
    startTime=Date.now();timerInt=setInterval(updateTimer,1000);loop();
  }catch(e){statusPill.textContent="⚠ 카메라 오류";alert("카메라를 사용할 수 없습니다.\nhttps 주소에서 열었는지 확인하세요.\n\n"+e.message);}
}
function applyMirror(){
  stageEl&&(facingMode==="user"?stageEl.classList.add("mirror"):stageEl.classList.remove("mirror"));
  if(camLabel)camLabel.textContent=facingMode==="user"?"셀카":"후면";
}
async function switchCamera(){
  facingMode=facingMode==="user"?"environment":"user";applyMirror();
  if(!running)return;
  try{
    if(stream)stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode,width:{ideal:720},height:{ideal:960}},audio:false});
    video.srcObject=stream;await video.play();
    canvas.width=video.videoWidth;canvas.height=video.videoHeight;
  }catch(e){alert("카메라 전환 실패: "+e.message);}
}
camBtn.addEventListener("click",switchCamera);

/* 루프 */
let lastTs=-1;
function loop(){
  if(!running)return;
  if(video.currentTime!==lastTs){
    lastTs=video.currentTime;
    const res=landmarker.detectForVideo(video,performance.now());
    drawPose(res);if(!resting)analyzeFrame(res);
  }
  rafId=requestAnimationFrame(loop);
}
function drawPose(res){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(res.landmarks&&res.landmarks.length&&drawUtils){
    for(const lm of res.landmarks){
      drawUtils.drawConnectors(lm,PoseLandmarker.POSE_CONNECTIONS,{color:"#4d8cff",lineWidth:3});
      drawUtils.drawLandmarks(lm,{color:"#37e6a4",radius:4});
    }
  }
}
function analyzeFrame(res){
  if(!res.landmarks||!res.landmarks.length){angleV.textContent="--";return;}
  const{val,counted}=EXERCISES[selEx].analyze(res.landmarks[0],exState);
  angleV.textContent=val;phaseTxt.textContent=exState.label||"-";
  if(counted)addCount();
}

/* 카운트 */
function addCount(){
  count++;countV.textContent=count;speakCount(count);beep(660,0.07);bump(countV);
  if(count>=targetReps)setComplete();
}
function setComplete(){curSet>=totalSets?finishAll():restSec>0?startRest():nextSet();}
function startRest(){
  resting=true;let left=restSec;restNumEl.textContent=left;restBanner.style.display="flex";beep(440,0.15);
  const ri=setInterval(()=>{left--;restNumEl.textContent=left;if(left<=0){clearInterval(ri);restBanner.style.display="none";resting=false;nextSet();}},1000);
}
function nextSet(){
  curSet++;count=0;
  const ex=EXERCISES[selEx];
  exState={phase:ex.initPhase,label:"-",smooth:null};
  countV.textContent="0";setV.textContent=curSet;beep(880,0.12);
}
function updateTimer(){
  const s=Math.floor((Date.now()-startTime)/1000);
  timerEl.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}
function stopAll(){
  running=false;if(rafId)cancelAnimationFrame(rafId);clearInterval(timerInt);
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  video.srcObject=null;ctx.clearRect(0,0,canvas.width,canvas.height);
  placeholder.style.display="flex";phasePill.style.display="none";
  statusPill.textContent="⚪ 준비 중";resting=false;restBanner.style.display="none";
}

/* 완료 */
function finishAll(){
  running=false;if(rafId)cancelAnimationFrame(rafId);clearInterval(timerInt);
  $("doneMsg").textContent=EXERCISES[selEx].name+" · "+totalSets+"세트 · "+(targetReps*totalSets)+"회 · "+timerEl.textContent;
  celebrate();setTimeout(stopAll,400);
}
let particles=[],fxRaf=null,celebTimer=null;
function celebrate(){
  clap(12);
  beep(523,0.2);setTimeout(()=>beep(659,0.2),150);setTimeout(()=>beep(784,0.3),300);
  fxLayer.style.display="block";fxCanvas.width=innerWidth;fxCanvas.height=innerHeight;
  doneCard.classList.add("show");
  spawnFirework();
  const burst=setInterval(spawnFirework,400);
  fxAnim();
  let ci=0;const clapInt=setInterval(()=>{ci++;clap(6);if(ci>=8)clearInterval(clapInt);},1200);
  setTimeout(()=>clearInterval(burst),8000);
  celebTimer=setTimeout(closeCelebration,10000);
}
function closeCelebration(){
  doneCard.classList.remove("show");fxLayer.style.display="none";
  particles=[];if(fxRaf)cancelAnimationFrame(fxRaf);if(celebTimer)clearTimeout(celebTimer);
  setTimeout(()=>showPage("p2"),300);
}
doneCard.addEventListener("click",closeCelebration);
function spawnFirework(){
  const cx=Math.random()*fxCanvas.width,cy=Math.random()*fxCanvas.height*.45+fxCanvas.height*.05;
  const hue=Math.floor(Math.random()*360);
  for(let i=0;i<50;i++){const a=(Math.PI*2*i)/50,sp=Math.random()*5+2;particles.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,hue});}
}
function fxAnim(){
  fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height);
  for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.07;p.vx*=.98;p.life-=.01;fxCtx.globalAlpha=Math.max(p.life,0);fxCtx.fillStyle=`hsl(${p.hue},90%,60%)`;fxCtx.beginPath();fxCtx.arc(p.x,p.y,3,0,Math.PI*2);fxCtx.fill();}
  fxCtx.globalAlpha=1;particles=particles.filter(p=>p.life>0);fxRaf=requestAnimationFrame(fxAnim);
}

/* 효과음 */
let actx=null;
function audio(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();return actx;}
function beep(freq,dur){
  try{const a=audio(),o=a.createOscillator(),g=a.createGain();o.frequency.value=freq;o.type="sine";o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.001,a.currentTime);g.gain.exponentialRampToValueAtTime(.25,a.currentTime+.01);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);o.start();o.stop(a.currentTime+dur);}catch(e){}
}
function clap(times=8){
  try{const a=audio();for(let i=0;i<times;i++){const t=a.currentTime+i*.12+Math.random()*.03;const buf=a.createBuffer(1,a.sampleRate*.05,a.sampleRate);const d=buf.getChannelData(0);for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*Math.pow(1-j/d.length,2);const src=a.createBufferSource();src.buffer=buf;const g=a.createGain();g.gain.value=.5;const f=a.createBiquadFilter();f.type="bandpass";f.frequency.value=1500;src.connect(f);f.connect(g);g.connect(a.destination);src.start(t);}}catch(e){}
}
function speakCount(n){
  try{const word=n<=30?KO_NUM[n]:String(n);const u=new SpeechSynthesisUtterance(word);u.lang="ko-KR";u.rate=1.1;u.pitch=1.1;u.volume=1;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
}

/* 유틸 */
function ang(a,b,c){const ab={x:a.x-b.x,y:a.y-b.y},cb={x:c.x-b.x,y:c.y-b.y};const m=Math.hypot(ab.x,ab.y)*Math.hypot(cb.x,cb.y);if(!m)return 180;return Math.acos(Math.max(-1,Math.min(1,(ab.x*cb.x+ab.y*cb.y)/m)))*180/Math.PI;}
function avg(a,b){return(a+b)/2;}
function bump(el){el.style.transition="transform .12s";el.style.transform="scale(1.4)";setTimeout(()=>el.style.transform="scale(1)",120);}
addEventListener("resize",()=>{if(fxLayer.style.display==="block"){fxCanvas.width=innerWidth;fxCanvas.height=innerHeight;}});
</script>
</body>
